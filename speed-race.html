<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Speed Race</title>


  <style>
    /* =======================================================================
       DESIGN TOKENS & RESET (100% offline, zero external dependencies)
    ======================================================================= */
    :root {
      --navy: #1b3060;
      --navy-dark: #112042;
      --gold: #eab026;
      --gold-dark: #c78d0e;
      --emerald: #0d9468;
      --emerald-dark: #08704e;
      --bg-outer: #0f1a33;
      --bg-deck: #edf2f8;
      --surface: #ffffff;
      --border: #d5dfec;
      --text-main: #14223e;
      --text-muted: #5a6b88;
      --radius-lg: 1.4cqw;
      --radius-md: 1cqw;
      --radius-pill: 999px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "Hiragino Maru Gothic ProN", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    input {
      -webkit-user-select: text;
      user-select: text;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-outer);
      font-family: var(--font);
      color: var(--text-main);
      touch-action: manipulation;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Strictly 16:9 responsive stage that fills TVs and landscape iPads */
    .app-frame {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      width: min(100dvw, calc(100dvh * 16 / 9));
      height: min(100dvh, calc(100dvw * 9 / 16));
      background: var(--surface);
      overflow: hidden;
      container-type: size;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    .screen.active {
      display: flex;
    }

    button {
      font-family: inherit;
      border: none;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.08s ease, filter 0.12s ease, opacity 0.15s ease, background-color 0.15s ease;
    }

    button:active:not(:disabled) {
      transform: scale(0.96);
    }

    button:disabled {
      opacity: 0.42;
      cursor: not-allowed;
    }

    /* =======================================================================
       SCREEN 1: START / TEAM SETUP
    ======================================================================= */
    #screen-start {
      background: linear-gradient(160deg, #f8fbff 0%, #e8effa 100%);
      padding: 3.2cqh 5cqw;
      justify-content: space-between;
      align-items: center;
    }

    .start-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2cqh;
    }

    .race-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.8cqw;
      background: var(--navy);
      color: #ffffff;
      padding: 0.9cqh 2cqw;
      border-radius: var(--radius-pill);
      font-size: 1.55cqw;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .race-badge svg {
      width: 1.7cqw;
      height: 1.7cqw;
      fill: var(--gold);
    }

    .start-title {
      font-size: 4.8cqw;
      font-weight: 900;
      letter-spacing: -0.02em;
      color: var(--navy);
      line-height: 1;
    }

    .start-title span {
      color: var(--gold-dark);
    }

    .start-subtitle {
      font-size: 1.8cqw;
      color: var(--text-muted);
      font-weight: 600;
    }

    .setup-panel {
      width: 100%;
      max-width: 82cqw;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.4cqh 3cqw;
      box-shadow: 0 10px 30px rgba(27, 48, 96, 0.08);
      display: flex;
      flex-direction: column;
      gap: 1.9cqh;
    }

    .mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2cqw;
    }

    .setup-label {
      font-size: 1.9cqw;
      font-weight: 800;
      color: var(--navy);
      white-space: nowrap;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1.2cqw;
      flex: 1;
      min-width: 0;
    }

    .mode-btn {
      padding: 1.6cqh 1cqw;
      border-radius: var(--radius-md);
      background: var(--bg-deck);
      color: var(--navy);
      font-size: 1.8cqw;
      font-weight: 800;
      border: 2px solid transparent;
    }

    .mode-btn.selected {
      background: var(--navy);
      color: #ffffff;
      border-color: var(--navy);
      box-shadow: 0 6px 16px rgba(27, 48, 96, 0.25);
    }

    .teams-editor {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      width: 100%;
      gap: 1.2cqw;
      min-height: 15cqh;
      align-content: center;
    }

    .teams-editor.empty-mode {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafd;
      border-radius: var(--radius-md);
      border: 2px dashed var(--border);
      color: var(--text-muted);
      font-size: 1.8cqw;
      font-weight: 600;
      padding: 3cqh;
    }

    .team-input-card {
      display: flex;
      align-items: center;
      gap: 1.2cqw;
      width: 100%;
      min-width: 0;
      overflow: hidden;
      background: #f8fafd;
      border: 2px solid var(--border);
      border-radius: var(--radius-md);
      padding: 1cqh 1.4cqw;
    }

    .colour-dot-btn {
      width: 3.6cqw;
      height: 3.6cqw;
      border-radius: 50%;
      flex-shrink: 0;
      border: 3px solid #ffffff;
      box-shadow: 0 0 0 2px rgba(20, 34, 62, 0.18);
    }

    .team-name-input {
      flex: 1 1 0%;
      width: 0;
      min-width: 0;
      max-width: 100%;
      border: 2px solid transparent;
      background: #ffffff;
      border-radius: 0.7cqw;
      padding: 1.2cqh 1.2cqw;
      font-family: inherit;
      font-size: 1.9cqw;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
    }

    .team-name-input:focus {
      border-color: var(--navy);
    }

    .colour-hint {
      font-size: 1.35cqw;
      color: var(--text-muted);
      font-weight: 600;
      text-align: right;
      margin-top: -1.4cqh;
    }

    .start-footer {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    .btn-start {
      background: var(--gold);
      color: var(--navy-dark);
      font-size: 2.6cqw;
      font-weight: 900;
      padding: 2.1cqh 6.5cqw;
      border-radius: var(--radius-pill);
      box-shadow: 0 7px 0 var(--gold-dark), 0 12px 24px rgba(234, 176, 38, 0.34);
      display: inline-flex;
      align-items: center;
      gap: 1.2cqw;
      letter-spacing: 0.02em;
    }

    .btn-start:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 3px 0 var(--gold-dark);
    }

    .btn-start svg {
      width: 2.4cqw;
      height: 2.4cqw;
      fill: currentColor;
    }

    /* =======================================================================
       SCREEN 2: GAMEPLAY
    ======================================================================= */
    #screen-game {
      background: var(--bg-deck);
    }

    /* Top Bar & Always-Visible Scoreboard (15cqh) */
    .top-bar {
      height: 15cqh;
      background: var(--navy);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2cqw;
      gap: 1.5cqw;
      flex-shrink: 0;
      z-index: 10;
    }

    .top-left {
      display: flex;
      align-items: center;
      gap: 1.1cqw;
      flex-shrink: 0;
    }

    .mini-title {
      font-size: 1.85cqw;
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #ffffff;
    }

    .mini-title span {
      color: var(--gold);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.85cqh 1.35cqw;
      border-radius: var(--radius-pill);
      font-size: 1.5cqw;
      font-weight: 800;
      white-space: nowrap;
    }

    .pill-progress {
      background: rgba(255, 255, 255, 0.14);
      color: #e6eefc;
    }

    .pill-points {
      background: var(--gold);
      color: var(--navy-dark);
    }

    .scoreboard {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.1cqw;
      height: 100%;
      padding: 1.5cqh 0;
      min-width: 0;
    }

    .scoreboard.hidden {
      visibility: hidden;
    }

    .team-score-btn {
      position: relative;
      flex: 1;
      max-width: 17cqw;
      height: 100%;
      background: rgba(255, 255, 255, 0.11);
      border: 2px solid rgba(255, 255, 255, 0.24);
      border-radius: var(--radius-md);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.2cqw;
      gap: 0.7cqw;
      overflow: hidden;
    }

    .team-score-btn::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0.7cqw;
      background: var(--team-colour, #ffffff);
    }

    .team-score-btn.prompt-award {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(234, 176, 38, 0.45);
      background: rgba(255, 255, 255, 0.18);
    }

    .team-score-btn.awarded {
      background: var(--team-colour, var(--emerald));
      border-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.45);
    }

    .team-score-name {
      font-size: 1.55cqw;
      font-weight: 800;
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding-left: 0.4cqw;
    }

    .team-score-val {
      font-size: 2.5cqw;
      font-weight: 900;
      line-height: 1;
      flex-shrink: 0;
    }

    .award-tag {
      position: absolute;
      top: 0.35cqh;
      right: 0.55cqw;
      background: #ffffff;
      color: var(--navy-dark);
      font-size: 1.05cqw;
      font-weight: 900;
      padding: 0.12cqh 0.5cqw;
      border-radius: var(--radius-pill);
      display: none;
    }

    .team-score-btn.awarded .award-tag {
      display: inline-block;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 0.75cqw;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 4.1cqw;
      height: 4.1cqw;
      border-radius: 0.9cqw;
      background: rgba(255, 255, 255, 0.13);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .icon-btn svg {
      width: 2.05cqw;
      height: 2.05cqw;
      fill: currentColor;
    }

    /* Race Track Stage (55cqh) */
    .stage {
      position: relative;
      height: 55cqh;
      width: 100%;
      background-color: #ffffff;
      background-image:
        linear-gradient(to bottom, transparent calc(25% - 1px), #e8eef7 calc(25% - 1px), #e8eef7 25%, transparent 25%),
        linear-gradient(to bottom, transparent calc(50% - 1px), #e8eef7 calc(50% - 1px), #e8eef7 50%, transparent 50%),
        linear-gradient(to bottom, transparent calc(75% - 1px), #e8eef7 calc(75% - 1px), #e8eef7 75%, transparent 75%);
      overflow: hidden;
      flex-shrink: 0;
      border-bottom: 2px solid var(--border);
    }

    /* Subtle start and finish chequered strips */
    .stage::before,
    .stage::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1.2cqw;
      opacity: 0.14;
      pointer-events: none;
      background-image: conic-gradient(var(--navy) 90deg, transparent 90deg 180deg, var(--navy) 180deg 270deg, transparent 270deg);
      background-size: 1.2cqw 1.2cqw;
    }

    .stage::before { left: 0; }
    .stage::after  { right: 0; }

    .stage-hud-left {
      position: absolute;
      top: 1.8cqh;
      left: 2.4cqw;
      display: flex;
      align-items: center;
      gap: 0.8cqw;
      z-index: 4;
      pointer-events: none;
    }

    .speed-chip {
      background: #f1f5fb;
      border: 1.5px solid var(--border);
      color: var(--navy);
      padding: 0.7cqh 1.3cqw;
      border-radius: var(--radius-pill);
      font-size: 1.45cqw;
      font-weight: 800;
    }

    .stage-hud-right {
      position: absolute;
      top: 1.8cqh;
      right: 2.4cqw;
      z-index: 4;
      pointer-events: none;
    }

    .award-hint {
      background: #fff7e0;
      border: 2px solid var(--gold);
      color: #7a5200;
      padding: 0.7cqh 1.4cqw;
      border-radius: var(--radius-pill);
      font-size: 1.45cqw;
      font-weight: 800;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .award-hint.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .stage-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 2;
    }

    .stage-status-pill {
      background: rgba(241, 245, 251, 0.94);
      border: 2px solid var(--border);
      color: var(--text-muted);
      padding: 1.4cqh 2.6cqw;
      border-radius: var(--radius-pill);
      font-size: 1.85cqw;
      font-weight: 700;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .stage-status-pill.visible {
      opacity: 1;
    }

    /* Flying Picture Sprite (positioned strictly via requestAnimationFrame) */
    .flyer {
      position: absolute;
      top: 0;
      left: 0;
      width: 25cqh;
      height: 25cqh;
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      will-change: transform;
      z-index: 5;
      pointer-events: none;
    }

    .flyer img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 14px rgba(17, 32, 66, 0.18));
    }

    .flyer .emoji-fallback {
      font-size: 18cqh;
      line-height: 1;
      filter: drop-shadow(0 8px 14px rgba(17, 32, 66, 0.16));
    }

    .flyer .letter-fallback,
    .reveal-media .letter-fallback {
      width: 82%;
      height: 82%;
      border-radius: 20%;
      background: var(--navy);
      color: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 11cqh;
      box-shadow: 0 10px 20px rgba(27, 48, 96, 0.2);
    }

    /* Centred Reveal Overlay */
    .reveal-panel {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2cqh;
      background: rgba(255, 255, 255, 0.95);
      z-index: 6;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.92);
      transition: none;
    }

    .reveal-panel.visible {
      opacity: 1;
      transform: scale(1);
      transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.05);
    }

    .reveal-panel.visible {
      opacity: 1;
      transform: scale(1);
    }

    .reveal-media {
      width: 31cqh;
      height: 31cqh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reveal-media img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 12px 22px rgba(17, 32, 66, 0.18));
    }

    .reveal-media .emoji-fallback {
      font-size: 24cqh;
      line-height: 1;
      filter: drop-shadow(0 10px 18px rgba(17, 32, 66, 0.15));
    }

    .reveal-word {
      font-size: 7.4cqh;
      font-weight: 900;
      color: var(--navy);
      letter-spacing: 0.01em;
      line-height: 1.05;
      padding: 0 4cqw;
      text-align: center;
    }

    /* Bottom Deck: Candidate Words + Giant Controls (30cqh) */
    .bottom-deck {
      height: 30cqh;
      padding: 2cqh 2.5cqw 2.4cqh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2cqh;
      flex-shrink: 0;
    }

    .candidates-row {
      height: 11.5cqh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.8cqw;
    }

    .candidate-card {
      flex: 1;
      height: 100%;
      background: #ffffff;
      border: 3px solid var(--border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2cqw;
      font-size: 3.3cqw;
      font-weight: 800;
      color: var(--navy);
      box-shadow: 0 4px 12px rgba(27, 48, 96, 0.06);
      transition: border-color 0.2s ease, background-color 0.2s ease, opacity 0.2s ease, transform 0.2s ease;
      text-align: center;
      line-height: 1.1;
    }

    .candidate-card.correct {
      background: #e6f9f1;
      border-color: var(--emerald);
      color: #065f46;
      transform: scale(1.02);
    }

    .candidate-card.dimmed {
      opacity: 0.35;
    }

    .or-badge {
      flex-shrink: 0;
      width: 4.8cqw;
      height: 4.8cqw;
      border-radius: 50%;
      background: var(--navy);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7cqw;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .controls-row {
      height: 12.2cqh;
      display: grid;
      grid-template-columns: 1.25fr 1.25fr 1fr;
      gap: 1.8cqw;
    }

    .ctrl-btn {
      height: 100%;
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.2cqw;
      font-size: 2.6cqw;
      font-weight: 900;
      padding: 0 2cqw;
    }

    .ctrl-btn svg {
      width: 2.6cqw;
      height: 2.6cqw;
      fill: currentColor;
      flex-shrink: 0;
    }

    .ctrl-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.05;
    }

    .ctrl-sub {
      font-size: 1.35cqw;
      font-weight: 700;
      opacity: 0.85;
      display: block;
      line-height: 1.1;
    }

    .btn-replay {
      background: var(--gold);
      color: var(--navy-dark);
      box-shadow: 0 5px 0 var(--gold-dark);
    }

    .btn-replay:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--gold-dark);
    }

    .btn-reveal {
      background: var(--navy);
      color: #ffffff;
      box-shadow: 0 5px 0 var(--navy-dark);
    }

    .btn-reveal:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--navy-dark);
    }

    .btn-next {
      background: var(--emerald);
      color: #ffffff;
      box-shadow: 0 5px 0 var(--emerald-dark);
    }

    .btn-next:active:not(:disabled) {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--emerald-dark);
    }

    .btn-next.pulse-ready {
      box-shadow: 0 5px 0 var(--emerald-dark), 0 0 0 4px rgba(13, 148, 104, 0.35);
    }

    /* =======================================================================
       SCREEN 3: END / WINNER SCREEN
    ======================================================================= */
    #screen-end {
      background: linear-gradient(160deg, #162850 0%, #1b3060 55%, #112042 100%);
      color: #ffffff;
      padding: 5cqh 6cqw;
      align-items: center;
      justify-content: space-between;
    }

    .end-header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4cqh;
    }

    .trophy-icon {
      width: 8cqw;
      height: 8cqw;
      fill: var(--gold);
      filter: drop-shadow(0 8px 20px rgba(234, 176, 38, 0.4));
    }

    .end-kicker {
      font-size: 1.7cqw;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .end-winner {
      font-size: 5.4cqw;
      font-weight: 900;
      line-height: 1.05;
    }

    .end-standings {
      width: 100%;
      max-width: 74cqw;
      display: flex;
      flex-direction: column;
      gap: 1.6cqh;
    }

    .standing-row {
      display: flex;
      align-items: center;

<body>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      // =====================================================================
      // CONFIGURATION & FALLBACK OBJECT EMOJIS (strictly no cartoon faces)
      // =====================================================================
      const INITIAL_DURATION_MS = 400;   // 0.4s initial left-to-right pass
      const MAX_DURATION_MS = 6400;      // Slowest speed cap
      const ROUND_LAUNCH_DELAY_MS = 240; // Brief settle pause before launch

      const FALLBACK_EMOJIS = {
        pencil: "✏️",
        book: "📘",
        ruler: "📏",
        scissors: "✂️",
        backpack: "🎒",
        chair: "🪑",
        notebook: "📓",
        crayon: "🖍️",
        clock: "🕒",
        globe: "🌍",
        pen: "🖊️",
        paperclip: "📎",
        paintbrush: "🖌️",
        calendar: "📅",
        bell: "🔔",
        key: "🔑",
        lamp: "💡",
        bag: "👜"
      };

      const TEAM_PALETTE = [
        { name: "Red",    hex: "#dc2626" },
        { name: "Blue",   hex: "#2563eb" },
        { name: "Green",  hex: "#059669" },
        { name: "Purple", hex: "#7c3aed" },
        { name: "Orange", hex: "#ea580c" },
        { name: "Teal",   hex: "#0891b2" }
      ];

      // =====================================================================
      // APPLICATION STATE
      // =====================================================================
      let WORDS = [];               // built from the ticked word sets
      let packs = [];               // from packs.json
      let currentPackFile = null;
      let packSets = [];            // sets in the current pack
      let selectedSetIds = new Set();
      let pointsMode = "scaled";    // "scaled" = 3/2/1, "flat" = 1 every time
      let packLoadError = false;
      const SAVE_KEY = "wg.speedrace";

      let teamCount = 2;
      let teams = [
        { name: "Red",    colourIndex: 0, score: 0 },
        { name: "Blue",   colourIndex: 1, score: 0 },
        { name: "Green",  colourIndex: 2, score: 0 },
        { name: "Purple", colourIndex: 3, score: 0 }
      ];

      let deck = [];
      let currentIndex = 0;
      let replayCount = 0;
      let isRevealed = false;
      let rafId = null;
      let launchTimerId = null;
      let lastY = null;
      let roundAwards = new Map(); // teamIndex -> points awarded this round
      let soundEnabled = true;
      let audioCtx = null;

      // =====================================================================
      // DOM REFERENCES
      // =====================================================================
      const screens = {
        start: document.getElementById("screen-start"),
        game:  document.getElementById("screen-game"),
        end:   document.getElementById("screen-end")
      };

      const wordCountSubtitle = document.getElementById("word-count-subtitle");
      const modeButtonsEl     = document.getElementById("mode-buttons");
      const teamsEditorEl     = document.getElementById("teams-editor");
      const colourHintEl      = document.getElementById("colour-hint");
      const btnStartGame      = document.getElementById("btn-start-game");
      const pointsButtonsEl   = document.getElementById("points-buttons");
      const packSelect        = document.getElementById("pack-select");
      const btnChoose         = document.getElementById("btn-choose");
      const chooseSum         = document.getElementById("choose-sum");
      const picker            = document.getElementById("picker");
      const pickerTitle       = document.getElementById("picker-title");
      const pickerList        = document.getElementById("picker-list");
      const pickerCount       = document.getElementById("picker-count");
      const pickerDone        = document.getElementById("picker-done");
      const pickerClear       = document.getElementById("picker-clear");

      const progressPill      = document.getElementById("progress-pill");
      const pointsPill        = document.getElementById("points-pill");
      const scoreboardEl      = document.getElementById("scoreboard");
      const btnSound          = document.getElementById("btn-sound");
      const iconSoundOn       = document.getElementById("icon-sound-on");
      const iconSoundOff      = document.getElementById("icon-sound-off");
      const btnFullscreen     = document.getElementById("btn-fullscreen");
      const btnHome           = document.getElementById("btn-home");

      const stageEl           = document.getElementById("stage");

      const awardHint         = document.getElementById("award-hint");
      const stageStatusPill   = document.getElementById("stage-status-pill");
      const flyerEl           = document.getElementById("flyer");
      const revealPanel       = document.getElementById("reveal-panel");
      const revealMedia       = document.getElementById("reveal-media");
      const revealWord        = document.getElementById("reveal-word");

      const candidateLeft     = document.getElementById("candidate-left");
      const candidateRight    = document.getElementById("candidate-right");
      const btnReplay         = document.getElementById("btn-replay");
      const replaySub         = document.getElementById("replay-sub");
      const btnReveal         = document.getElementById("btn-reveal");
      const btnNext           = document.getElementById("btn-next");
      const nextLabel         = document.getElementById("next-label");
      const nextSub           = document.getElementById("next-sub");

      const endKicker         = document.getElementById("end-kicker");
      const endWinner         = document.getElementById("end-winner");
      const endStandings      = document.getElementById("end-standings");
      const btnPlayAgain      = document.getElementById("btn-play-again");
      const btnChangeTeams    = document.getElementById("btn-change-teams");

      // =====================================================================
      // PICTURE RENDERER (pack pictures are built into the pack file)
      // =====================================================================

      function renderFallbackInto(container, item) {
        container.innerHTML = "";
        const key = String(item.word || "").trim().toLowerCase();
        const emoji = item.emoji || FALLBACK_EMOJIS[key];

        if (emoji) {
          const span = document.createElement("span");
          span.className = "emoji-fallback";
          span.textContent = emoji;
          container.appendChild(span);
          return;
        }

        const badge = document.createElement("div");
        badge.className = "letter-fallback";
        badge.textContent = (item.word || "?").charAt(0).toUpperCase();
        container.appendChild(badge);
      }

      function renderVisualInto(container, item) {
        container.innerHTML = "";

        if (item.image) {
          const img = document.createElement("img");
          img.src = item.image;
          img.alt = item.word;
          img.draggable = false;
          img.onerror = () => renderFallbackInto(container, item);
          container.appendChild(img);
          return;
        }

        renderFallbackInto(container, item);
      }

      // =====================================================================
      // OFFLINE WEB AUDIO SYNTHESIS (zero external audio files)
      // =====================================================================
      function ensureAudio() {
        if (!soundEnabled) return null;
        try {
          if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (!AudioContextClass) return null;
            audioCtx = new AudioContextClass();
          }
          if (audioCtx.state === "suspended") {
            audioCtx.resume().catch(() => {});
          }
          return audioCtx;
        } catch (_) {
          return null;
        }
      }

      function playWhoosh(durationMs) {
        const ctx = ensureAudio();
        if (!ctx) return;
        try {
          const now = ctx.currentTime;
          const dur = Math.min(Math.max(durationMs / 1000, 0.25), 1.1);
          const bufferSize = Math.floor(ctx.sampleRate * dur);
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }

          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = "bandpass";
          filter.Q.value = 1.6;
          filter.frequency.setValueAtTime(320, now);
          filter.frequency.exponentialRampToValueAtTime(1400, now + dur * 0.45);
          filter.frequency.exponentialRampToValueAtTime(280, now + dur);

          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.16, now + dur * 0.35);
          gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

          noise.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);

          noise.start(now);
          noise.stop(now + dur);
        } catch (_) {}
      }

      function playTone(freq, startOffset, duration, type = "triangle", volume = 0.14) {
        const ctx = ensureAudio();
        if (!ctx) return;
        try {
          const now = ctx.currentTime + startOffset;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(volume, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (_) {}
      }

      function playRevealSound() {
        playTone(523.25, 0,    0.16, "triangle", 0.14);
        playTone(659.25, 0.07, 0.18, "triangle", 0.14);
        playTone(783.99, 0.14, 0.28, "triangle", 0.16);
      }

      function playPointSound(added) {
        if (added) {
          playTone(659.25, 0,    0.12, "sine", 0.15);
          playTone(987.77, 0.07, 0.22, "sine", 0.16);
        } else {
          playTone(392.00, 0,    0.14, "sine", 0.11);
        }
      }

      function playVictorySound() {
        [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
          playTone(freq, i * 0.1, 0.32, "triangle", 0.15);
        });
      }

      // =====================================================================
      // HELPERS
      // =====================================================================
      function shuffle(array) {
        const copy = array.slice();
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      function showScreen(name) {
        Object.entries(screens).forEach(([key, el]) => {
          el.classList.toggle("active", key === name);
        });
      }

      function pointsFor(replays) {
        if (pointsMode === "flat") return 1;
        if (replays === 0) return 3;
        if (replays === 1) return 2;
        return 1;
      }

      function getCurrentPoints() {
        return pointsFor(replayCount);
      }

      function getDurationForReplay(replays) {
        // 50% slower each replay = speed halves = duration doubles (0.4s -> 0.8s -> 1.6s -> 3.2s -> 6.4s)
        return Math.min(INITIAL_DURATION_MS * Math.pow(2, replays), MAX_DURATION_MS);
      }

      function formatSeconds(ms) {
        const sec = ms / 1000;
        return sec >= 10 ? `${Math.round(sec)}s` : `${sec.toFixed(1)}s`;
      }

      // =====================================================================
      // START SCREEN & TEAM CONFIGURATION
      // =====================================================================
      function renderTeamSetup() {
        renderWordsSummary();
        pointsButtonsEl.querySelectorAll(".mode-btn").forEach((btn) => {
          btn.classList.toggle("selected", btn.dataset.points === pointsMode);
        });

        modeButtonsEl.querySelectorAll(".mode-btn").forEach((btn) => {
          btn.classList.toggle("selected", Number(btn.dataset.teams) === teamCount);
        });

        teamsEditorEl.innerHTML = "";

        if (teamCount === 0) {
          teamsEditorEl.classList.add("empty-mode");
          teamsEditorEl.textContent = "Whole-class mode — no team scores";
          colourHintEl.style.visibility = "hidden";
          return;
        }

        teamsEditorEl.classList.remove("empty-mode");
        colourHintEl.style.visibility = "visible";

        for (let i = 0; i < teamCount; i++) {
          const team = teams[i];
          const colour = TEAM_PALETTE[team.colourIndex % TEAM_PALETTE.length];

          const card = document.createElement("div");
          card.className = "team-input-card";

          const dotBtn = document.createElement("button");
          dotBtn.type = "button";
          dotBtn.className = "colour-dot-btn";
          dotBtn.style.backgroundColor = colour.hex;
          dotBtn.setAttribute("aria-label", `Change colour for team ${i + 1}`);
          dotBtn.addEventListener("click", () => {
            const prevColourName = TEAM_PALETTE[team.colourIndex % TEAM_PALETTE.length].name;
            team.colourIndex = (team.colourIndex + 1) % TEAM_PALETTE.length;
            const nextColour = TEAM_PALETTE[team.colourIndex];
            dotBtn.style.backgroundColor = nextColour.hex;
            if (team.name.trim() === prevColourName) {
              team.name = nextColour.name;
              input.value = nextColour.name;
            }
          });

          const input = document.createElement("input");
          input.type = "text";
          input.className = "team-name-input";
          input.size = 1;
          input.value = team.name;
          input.maxLength = 16;
          input.placeholder = `Team ${i + 1}`;
          input.addEventListener("input", (e) => {
            team.name = e.target.value;
          });

          card.appendChild(dotBtn);
          card.appendChild(input);
          teamsEditorEl.appendChild(card);
        }
      }

      modeButtonsEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".mode-btn");
        if (!btn) return;
        teamCount = Number(btn.dataset.teams);
        renderTeamSetup();
        saveSettings();
      });

      pointsButtonsEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".mode-btn");
        if (!btn) return;
        pointsMode = btn.dataset.points;
        renderTeamSetup();
        saveSettings();
      });

      // =====================================================================
      // WORD PACKS & WORD SET PICKER (reads the same packs as Word Games)
      // =====================================================================
      function loadSettings() {
        try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || {}; } catch (_) { return {}; }
      }

      function saveSettings() {
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify({
            pack: currentPackFile, sets: [...selectedSetIds], points: pointsMode, teams: teamCount
          }));
        } catch (_) {}
      }

      function unitOf(set) {
        const t = String(set.title || "");
        const i = t.indexOf(" · ");
        return i > 0 ? t.slice(0, i).trim() : "Other";
      }

      function labelOf(set) {
        const t = String(set.title || "");
        const i = t.indexOf(" · ");
        return i > 0 ? t.slice(i + 3).trim() : t;
      }

      function rebuildWords() {
        const seen = new Map();
        packSets.forEach((set) => {
          if (!selectedSetIds.has(set.id)) return;
          (set.items || []).forEach((it) => {
            const w = String(it.word || "").trim();
            if (!w) return;
            const key = w.toLowerCase();
            if (!seen.has(key)) seen.set(key, { word: w, image: it.image || "", emoji: it.emoji || "" });
          });
        });
        WORDS = [...seen.values()];
      }

      function renderWordsSummary() {
        const nSets = packSets.filter((s) => selectedSetIds.has(s.id)).length;
        if (packLoadError) {
          wordCountSubtitle.textContent = "Couldn't load the word sets. Open this page from the Word Games website.";
        } else if (!packSets.length) {
          wordCountSubtitle.textContent = "Loading word sets…";
        } else if (WORDS.length < 2) {
          wordCountSubtitle.textContent = "Choose at least 2 words to start";
        } else {
          wordCountSubtitle.textContent = `${WORDS.length} words ready to play`;
        }
        chooseSum.textContent = nSets
          ? `${nSets} ${nSets === 1 ? "set" : "sets"} · ${WORDS.length} ${WORDS.length === 1 ? "word" : "words"}`
          : "Choose word sets";
        btnChoose.classList.toggle("needs", WORDS.length < 2);
        btnStartGame.disabled = WORDS.length < 2;
      }

      function renderPicker() {
        pickerList.innerHTML = "";
        pickerTitle.textContent = `Choose word sets · ${packs.find((p) => p.file === currentPackFile)?.name || ""}`;

        if (!packSets.length) {
          const msg = document.createElement("div");
          msg.className = "picker-msg";
          msg.textContent = packLoadError ? "Couldn't load this pack." : "Loading…";
          pickerList.appendChild(msg);
        }

        const groups = new Map();
        packSets.forEach((set) => {
          const u = unitOf(set);
          if (!groups.has(u)) groups.set(u, []);
          groups.get(u).push(set);
        });

        groups.forEach((sets, unit) => {
          const group = document.createElement("div");
          group.className = "unit-group";

          const head = document.createElement("div");
          head.className = "unit-head";
          const name = document.createElement("div");
          name.className = "unit-name";
          name.textContent = unit;
          const allBtn = document.createElement("button");
          allBtn.type = "button";
          allBtn.className = "picker-small";
          const allOn = sets.every((s) => selectedSetIds.has(s.id));
          allBtn.textContent = allOn ? `Untick all ${unit}` : `Tick all ${unit}`;
          allBtn.addEventListener("click", () => {
            sets.forEach((s) => (allOn ? selectedSetIds.delete(s.id) : selectedSetIds.add(s.id)));
            afterSelectionChange();
          });
          head.appendChild(name);
          head.appendChild(allBtn);

          const chips = document.createElement("div");
          chips.className = "chips";
          sets.forEach((set) => {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "chip" + (selectedSetIds.has(set.id) ? " on" : "");
            chip.textContent = labelOf(set);
            const n = document.createElement("span");
            n.className = "chip-n";
            n.textContent = String((set.items || []).length);
            chip.appendChild(n);
            chip.addEventListener("click", () => {
              if (selectedSetIds.has(set.id)) selectedSetIds.delete(set.id);
              else selectedSetIds.add(set.id);
              afterSelectionChange();
            });
            chips.appendChild(chip);
          });

          group.appendChild(head);
          group.appendChild(chips);
          pickerList.appendChild(group);
        });

        pickerCount.textContent = `${WORDS.length} ${WORDS.length === 1 ? "word" : "words"} chosen`;
      }

      function afterSelectionChange() {
        const scroll = pickerList.scrollTop;
        rebuildWords();
        renderPicker();
        pickerList.scrollTop = scroll;
        renderWordsSummary();
        saveSettings();
      }

      async function loadPack(file, savedSets) {
        currentPackFile = file;
        packSets = [];
        packLoadError = false;
        selectedSetIds = new Set();
        rebuildWords();
        renderWordsSummary();
        renderPicker();
        try {
          const res = await fetch(file);
          if (!res.ok) throw new Error(res.status);
          const data = await res.json();
          if (currentPackFile !== file) return; // a different pack was chosen meanwhile
          packSets = Array.isArray(data.sets) ? data.sets : [];
          const ids = new Set(packSets.map((s) => s.id));
          (savedSets || []).forEach((id) => { if (ids.has(id)) selectedSetIds.add(id); });
        } catch (_) {
          packLoadError = true;
        }
        rebuildWords();
        renderWordsSummary();
        renderPicker();
      }

      async function initPacks() {
        const saved = loadSettings();
        if (saved.points === "flat" || saved.points === "scaled") pointsMode = saved.points;
        if ([0, 2, 3, 4].includes(saved.teams)) teamCount = saved.teams;
        renderTeamSetup();
        try {
          const res = await fetch("packs.json", { cache: "no-store" });
          const data = await res.json();
          packs = Array.isArray(data.packs) ? data.packs : [];
        } catch (_) {
          packs = [];
        }
        if (!packs.length) {
          packLoadError = true;
          renderWordsSummary();
          return;
        }
        packSelect.innerHTML = "";
        packs.forEach((p) => {
          const opt = document.createElement("option");
          opt.value = p.file;
          opt.textContent = p.name || p.file;
          packSelect.appendChild(opt);
        });
        const start = packs.find((p) => p.file === saved.pack)
          || packs.find((p) => /grapeseed/i.test(p.file))
          || packs[0];
        packSelect.value = start.file;
        await loadPack(start.file, start.file === saved.pack ? saved.sets : []);
        if (WORDS.length < 2) openPicker();
      }

      function openPicker() {
        renderPicker();
        picker.classList.add("open");
      }

      packSelect.addEventListener("change", () => {
        loadPack(packSelect.value, []).then(() => { saveSettings(); openPicker(); });
      });
      btnChoose.addEventListener("click", openPicker);
      pickerDone.addEventListener("click", () => picker.classList.remove("open"));
      pickerClear.addEventListener("click", () => { selectedSetIds = new Set(); afterSelectionChange(); });

      // =====================================================================
      // SCOREBOARD
      // =====================================================================
      function renderScoreboard() {
        scoreboardEl.innerHTML = "";
        if (teamCount === 0) {
          scoreboardEl.classList.add("hidden");
          pointsPill.style.display = "none";
          return;
        }

        scoreboardEl.classList.remove("hidden");
        pointsPill.style.display = "inline-flex";

        for (let i = 0; i < teamCount; i++) {
          const team = teams[i];
          const colour = TEAM_PALETTE[team.colourIndex % TEAM_PALETTE.length];
          const awardedPts = roundAwards.get(i);

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "team-score-btn";
          btn.style.setProperty("--team-colour", colour.hex);

          if (awardedPts) {
            btn.classList.add("awarded");
          } else if (isRevealed && roundAwards.size === 0) {
            btn.classList.add("prompt-award");
          }

          const nameSpan = document.createElement("span");
          nameSpan.className = "team-score-name";
          nameSpan.textContent = team.name.trim() || `Team ${i + 1}`;

          const scoreSpan = document.createElement("span");
          scoreSpan.className = "team-score-val";
          scoreSpan.textContent = team.score;

          const tagSpan = document.createElement("span");
          tagSpan.className = "award-tag";
          tagSpan.textContent = awardedPts ? `+${awardedPts}` : "";

          btn.appendChild(nameSpan);
          btn.appendChild(scoreSpan);
          btn.appendChild(tagSpan);

          btn.addEventListener("click", () => toggleTeamAward(i));
          scoreboardEl.appendChild(btn);
        }
      }

      function toggleTeamAward(teamIndex) {
        if (teamCount === 0) return;

        if (roundAwards.has(teamIndex)) {
          const prevPts = roundAwards.get(teamIndex);
          teams[teamIndex].score = Math.max(0, teams[teamIndex].score - prevPts);
          roundAwards.delete(teamIndex);
          playPointSound(false);
        } else {
          const pts = getCurrentPoints();
          teams[teamIndex].score += pts;
          roundAwards.set(teamIndex, pts);
          playPointSound(true);
        }

        renderScoreboard();
        updateAwardHint();
      }

      function updateAwardHint() {
        if (teamCount > 0 && isRevealed && roundAwards.size === 0) {
          const pts = getCurrentPoints();
          awardHint.textContent = `Tap a team above for +${pts} ${pts === 1 ? "pt" : "pts"}`;
          awardHint.classList.add("visible");
        } else {
          awardHint.classList.remove("visible");
        }
      }

      // =====================================================================
      // SMOOTH FLIGHT ANIMATION (requestAnimationFrame)
      // =====================================================================
      function cancelFlight() {
        if (launchTimerId !== null) {
          clearTimeout(launchTimerId);
          launchTimerId = null;
        }
        if (rafId !== null) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
      }

      function chooseVerticalPosition(isRandom) {
        const stageH = stageEl.clientHeight;
        const flyerH = flyerEl.offsetHeight;
        const padTop = Math.max(stageH * 0.14, 16);
        const padBottom = Math.max(stageH * 0.08, 12);
        const minY = padTop;
        const maxY = Math.max(minY, stageH - flyerH - padBottom);
        const span = maxY - minY;

        if (!isRandom || span <= 4) {
          const midY = minY + span * 0.5;
          lastY = midY;
          return midY;
        }

        // Choose a noticeably different random height from the last pass
        let candidateY = minY + Math.random() * span;
        if (lastY !== null) {
          for (let attempt = 0; attempt < 8; attempt++) {
            const trial = minY + Math.random() * span;
            if (Math.abs(trial - lastY) >= span * 0.28) {
              candidateY = trial;
              break;
            }
          }
        }
        lastY = candidateY;
        return candidateY;
      }

      function launchFlight(durationMs, randomHeight) {
        cancelFlight();
        stageStatusPill.classList.remove("visible");

        const stageW = stageEl.clientWidth;
        const flyerW = flyerEl.offsetWidth;
        const startX = -flyerW - 24;
        const endX = stageW + 24;
        const totalDist = endX - startX;
        const yPos = chooseVerticalPosition(randomHeight);

        flyerEl.style.visibility = "visible";
        flyerEl.style.transform = `translate3d(${startX}px, ${yPos}px, 0)`;

        const startTime = performance.now();
        playWhoosh(durationMs);

        function tick(now) {
          const elapsed = now - startTime;
          const progress = Math.min(elapsed / durationMs, 1);
          const currentX = startX + totalDist * progress;

          flyerEl.style.transform = `translate3d(${currentX}px, ${yPos}px, 0)`;

          if (progress < 1) {
            rafId = requestAnimationFrame(tick);
          } else {
            rafId = null;
            flyerEl.style.visibility = "hidden";
            if (!isRevealed) {
              stageStatusPill.classList.add("visible");
            }
          }
        }

        rafId = requestAnimationFrame(tick);
      }

      // =====================================================================
      // GAMEPLAY FLOW
      // =====================================================================
      function startGame() {
        if (WORDS.length < 2) return;
        ensureAudio();

        for (let i = 0; i < teams.length; i++) {
          teams[i].score = 0;
        }

        deck = shuffle(WORDS);
        currentIndex = 0;
        showScreen("game");
        loadRound();
      }

      function pickCandidates(correctItem) {
        const others = WORDS.filter((w) => w.word !== correctItem.word);
        const distractor = others.length
          ? others[Math.floor(Math.random() * others.length)]
          : { word: "—" };
        return Math.random() < 0.5
          ? [correctItem.word, distractor.word]
          : [distractor.word, correctItem.word];
      }

      function updateRoundUI() {
        const pts = getCurrentPoints();
        const duration = getDurationForReplay(replayCount);

        progressPill.textContent = `${currentIndex + 1} / ${deck.length}`;
        pointsPill.textContent = `${pts} ${pts === 1 ? "pt" : "pts"}`;

        speedChip.textContent = replayCount === 0
          ? `Pass 1 · ${formatSeconds(duration)}`
          : `Replay ${replayCount} · ${formatSeconds(duration)}`;

        const nextReplayPts = pointsFor(replayCount + 1);
        const nextDur = getDurationForReplay(replayCount + 1);
        replaySub.textContent = teamCount > 0
          ? `${formatSeconds(nextDur)} · ${nextReplayPts} ${nextReplayPts === 1 ? "pt" : "pts"}`
          : `Slower · ${formatSeconds(nextDur)}`;

        btnReplay.disabled = isRevealed;
        btnReveal.disabled = isRevealed;

        const isLastWord = currentIndex === deck.length - 1;
        nextLabel.textContent = isLastWord ? "Finish" : "Next";
        nextSub.textContent = isLastWord ? "See results" : "Next picture";
        btnNext.classList.toggle("pulse-ready", isRevealed);

        renderScoreboard();
        updateAwardHint();
      }

      function loadRound() {
        cancelFlight();
        replayCount = 0;
        isRevealed = false;
        lastY = null;
        roundAwards = new Map();

        const currentItem = deck[currentIndex];
        revealPanel.classList.remove("visible");
        revealMedia.innerHTML = "";
        revealWord.textContent = "";

        stageStatusPill.classList.remove("visible");
        flyerEl.style.visibility = "hidden";
        flyerEl.style.transform = "translate3d(-9999px, 0, 0)";
        renderVisualInto(flyerEl, currentItem);

        const [leftWord, rightWord] = pickCandidates(currentItem);
        candidateLeft.textContent = leftWord;
        candidateRight.textContent = rightWord;
        candidateLeft.className = "candidate-card";
        candidateRight.className = "candidate-card";

        updateRoundUI();

        // Short pause before launching the fast 0.4s pass
        launchTimerId = setTimeout(() => {
          launchTimerId = null;
          if (!isRevealed) {
            launchFlight(INITIAL_DURATION_MS, false);
          }
        }, ROUND_LAUNCH_DELAY_MS);
      }

      function handleReplay() {
        if (isRevealed) return;
        replayCount += 1;
        updateRoundUI();
        launchFlight(getDurationForReplay(replayCount), true);
      }

      function handleReveal() {
        if (isRevealed) return;
        cancelFlight();
        isRevealed = true;
        flyerEl.style.visibility = "hidden";
        stageStatusPill.classList.remove("visible");

        const currentItem = deck[currentIndex];
        renderVisualInto(revealMedia, currentItem);
        revealWord.textContent = currentItem.word;
        revealPanel.classList.add("visible");

        const correctWord = currentItem.word;
        [candidateLeft, candidateRight].forEach((card) => {
          if (card.textContent === correctWord) {
            card.classList.add("correct");
          } else {
            card.classList.add("dimmed");
          }
        });

        playRevealSound();
        updateRoundUI();
      }

      function handleNext() {
        cancelFlight();
        if (currentIndex + 1 < deck.length) {
          currentIndex += 1;
          loadRound();
        } else {
          showEndScreen();
        }
      }

      // =====================================================================
      // END SCREEN & STANDINGS
      // =====================================================================
      function showEndScreen() {
        cancelFlight();
        endStandings.innerHTML = "";
        playVictorySound();

        if (teamCount === 0) {
          endKicker.textContent = "Well Done";
          endWinner.textContent = "Race Complete!";
          const summary = document.createElement("div");
          summary.className = "end-solo-summary";
          summary.textContent = `You finished all ${deck.length} words.`;
          endStandings.appendChild(summary);
          showScreen("end");
          return;
        }

        const activeTeams = teams.slice(0, teamCount).map((t, idx) => ({
          name: t.name.trim() || `Team ${idx + 1}`,
          colour: TEAM_PALETTE[t.colourIndex % TEAM_PALETTE.length].hex,
          score: t.score
        }));

        activeTeams.sort((a, b) => b.score - a.score);
        const topScore = activeTeams[0].score;
        const winners = activeTeams.filter((t) => t.score === topScore);

        if (topScore === 0) {
          endKicker.textContent = "Race Complete";
          endWinner.textContent = "Great Effort Everyone!";
        } else if (winners.length > 1) {
          endKicker.textContent = "Final Result";
          endWinner.textContent = "It's a Tie!";
        } else {
          endKicker.textContent = "Winner";
          endWinner.textContent = `${winners[0].name} Wins!`;
        }

        activeTeams.forEach((team, idx) => {
          const isWinner = topScore > 0 && team.score === topScore;
          const row = document.createElement("div");
          row.className = `standing-row${isWinner ? " winner-row" : ""}`;

          const left = document.createElement("div");
          left.className = "standing-left";

          const rank = document.createElement("div");
          rank.className = "standing-rank";
          rank.textContent = isWinner ? "1" : String(idx + 1);

          const swatch = document.createElement("div");
          swatch.className = "standing-swatch";
          swatch.style.backgroundColor = team.colour;

          const name = document.createElement("div");
          name.className = "standing-name";
          name.textContent = team.name;

          left.appendChild(rank);
          left.appendChild(swatch);
          left.appendChild(name);

          const score = document.createElement("div");
          score.className = "standing-score";
          score.textContent = `${team.score} ${team.score === 1 ? "pt" : "pts"}`;

          row.appendChild(left);
          row.appendChild(score);
          endStandings.appendChild(row);
        });

        showScreen("end");
      }

      // =====================================================================
      // EVENT LISTENERS
      // =====================================================================
      btnStartGame.addEventListener("click", startGame);
      btnReplay.addEventListener("click", handleReplay);
      btnReveal.addEventListener("click", handleReveal);
      btnNext.addEventListener("click", handleNext);

      btnPlayAgain.addEventListener("click", startGame);
      btnChangeTeams.addEventListener("click", () => {
        cancelFlight();
        renderTeamSetup();
        showScreen("start");
      });

      btnHome.addEventListener("click", () => {
        cancelFlight();
        renderTeamSetup();
        showScreen("start");
      });

      btnSound.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        iconSoundOn.style.display = soundEnabled ? "block" : "none";
        iconSoundOff.style.display = soundEnabled ? "none" : "block";
      });

      btnFullscreen.addEventListener("click", () => {
        try {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.().catch(() => {});
          } else {
            document.exitFullscreen?.().catch(() => {});
          }
        } catch (_) {}
      });

      if (!document.fullscreenEnabled) {
        btnFullscreen.style.display = "none";
      }

      // Optional keyboard shortcuts when testing on a laptop
      document.addEventListener("keydown", (e) => {
        if (!screens.game.classList.contains("active")) return;
        if (e.target.tagName === "INPUT") return;

        if (e.code === "Space" || e.key.toLowerCase() === "r") {
          e.preventDefault();
          handleReplay();
        } else if (e.key === "Enter") {
          e.preventDefault();
          if (!isRevealed) handleReveal();
          else handleNext();
        } else if (e.key === "ArrowRight" || e.key.toLowerCase() === "n") {
          e.preventDefault();
          handleNext();
        } else if (["1", "2", "3", "4"].includes(e.key)) {
          const idx = Number(e.key) - 1;
          if (idx < teamCount) toggleTeamAward(idx);
        }
      });

      // =====================================================================
      // INITIALISE
      // =====================================================================
      initPacks();
    });
  </script>
</body>
</html>
