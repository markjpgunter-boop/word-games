<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Word Games">
<meta name="format-detection" content="telephone=no">
<title>Word Games</title>
<style>
/* =====================================================================
   WORD GAMES — single-file classroom game maker
   CSS sections:  1 Themes  2 Base  3 Buttons/forms  4 Library  5 Editor
   6 Hub/options  7 Game shell  8 Image quiz  9 Anagram  10 Balloon pop
   11 End screen  12 Modal/toast  13 Print
   ===================================================================== */

/* ---------- 1. THEMES (CSS variables only) ---------- */
:root{
  --font-ui:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Hiragino Maru Gothic ProN",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-word:"Chalkboard SE","Comic Sans MS","Comic Neue",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
}
body,body[data-theme="classroom"]{
  --bg:#fff6dc;--bg-img:radial-gradient(#f1dc9f 1.5px,transparent 1.7px);--bg-size:26px 26px;
  --panel:#ffffff;--panel2:#fff0c2;--ink:#1b2a4e;--muted:#56628a;--line:#e8d9a8;
  --primary:#2563eb;--on-primary:#ffffff;--accent:#ff8c1a;
  --good:#15933f;--on-good:#ffffff;--bad:#dc2647;--on-bad:#ffffff;
  --tile:#ffd23f;--tile-ink:#1b2a4e;--tile-edge:#d9a400;--cover:#2f6fed;--cover-edge:#1d4fc0;
  --sky:linear-gradient(#bfe6ff,#eef9ff 75%);--ground-c:#7ac74f;--rail:#6b4f2a;--cart:#ef476f;
}
body[data-theme="space"]{
  --bg:#0c1136;--bg-img:radial-gradient(#ffffff 1px,transparent 1.3px),radial-gradient(#8fa6ff 1.2px,transparent 1.5px);--bg-size:90px 90px,140px 140px;
  --panel:#1b2360;--panel2:#2a347f;--ink:#f5f7ff;--muted:#b9c2f2;--line:#3d489c;
  --primary:#8b6cff;--on-primary:#ffffff;--accent:#ffd23f;
  --good:#34d399;--on-good:#062a1e;--bad:#ff6b8b;--on-bad:#3a0614;
  --tile:#3fe0c5;--tile-ink:#06262b;--tile-edge:#16a892;--cover:#8b6cff;--cover-edge:#5b3fd6;
  --sky:linear-gradient(#0c1136,#2a3390);--ground-c:#4a5290;--rail:#aab3ea;--cart:#ff7a59;
}
body[data-theme="jungle"]{
  --bg:#e3f4d0;--bg-img:radial-gradient(#c2e2a0 2px,transparent 2.3px);--bg-size:30px 30px;
  --panel:#fffdf0;--panel2:#e9f5cf;--ink:#17331a;--muted:#4a6746;--line:#c6dda9;
  --primary:#15803d;--on-primary:#ffffff;--accent:#f97316;
  --good:#15803d;--on-good:#ffffff;--bad:#d62839;--on-bad:#ffffff;
  --tile:#ffdd4a;--tile-ink:#17331a;--tile-edge:#d1a800;--cover:#1f9d55;--cover-edge:#13703b;
  --sky:linear-gradient(#aee4ff,#e9f9d9 78%);--ground-c:#4caf50;--rail:#6b4f2a;--cart:#f97316;
}

/* ---------- 2. BASE ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{height:100%;font-size:clamp(15px,1.05vw + 6px,20px)}
body{margin:0;position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;font-family:var(--font-ui);color:var(--ink);
  background-color:var(--bg);background-image:var(--bg-img);background-size:var(--bg-size);
  -webkit-text-size-adjust:100%;overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app{position:absolute;top:0;left:0;right:0;bottom:0}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.active{display:flex}
.bar{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;background:var(--panel);border-bottom:3px solid var(--line);flex-wrap:wrap;flex:none}
.bar h1{font-size:1.45rem;margin:0;flex:1;min-width:6em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:1rem}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:1rem 1.2rem}
.hint,.foot{color:var(--muted);margin:.2rem 0 .9rem;line-height:1.4}
.empty{color:var(--muted);font-size:1.15rem;padding:2rem 0;text-align:center}
.pic{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pic img,.pic svg{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7%)}40%{transform:translateX(7%)}60%{transform:translateX(-5%)}80%{transform:translateX(5%)}}
@keyframes popin{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes fadeout{0%,70%{opacity:1}100%{opacity:0;visibility:hidden}}

/* ---------- 3. BUTTONS AND FORMS ---------- */
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;border:0;border-radius:14px;padding:.55em 1em;font-weight:700;
  background:var(--panel2);color:var(--ink);box-shadow:0 3px 0 var(--line);min-height:44px;white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--primary);color:var(--on-primary);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn.danger{background:var(--bad);color:var(--on-bad);box-shadow:0 3px 0 rgba(0,0,0,.28)}
.btn.big{font-size:1.25rem;padding:.7em 1.3em}
.btn.sm{font-size:.85rem;padding:.4em .7em;min-height:38px}
.btn[disabled]{opacity:.45;pointer-events:none}
.inp,.sel{width:100%;border:2px solid var(--line);border-radius:12px;padding:.5em .7em;background:var(--panel);color:var(--ink);font-size:max(16px,1rem);min-height:44px}
.sel{width:auto;font-weight:700}
.inp:focus,.sel:focus{outline:3px solid var(--primary);outline-offset:1px}
textarea.inp{min-height:11em;resize:vertical;line-height:1.4}
.chk{display:flex;align-items:center;gap:.6em;font-weight:700;padding:.45em 0;font-size:1.05rem}
.chk input{width:1.5em;height:1.5em;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;left:-10px;top:0}

/* ---------- 4. LIBRARY ---------- */
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1rem;margin-top:1rem}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card-main{border:0;background:transparent;text-align:left;padding:.8rem .9rem .5rem;display:block;width:100%}
.thumbs{display:flex;gap:.4rem;height:4.4rem;margin-bottom:.5rem}
.thumbs .pic{width:4.4rem;height:4.4rem;border-radius:10px;background:#fff;border:1px solid var(--line)}
.card-t{font-size:1.25rem;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-n{color:var(--muted);font-size:.95rem}
.card-acts{display:flex;flex-wrap:wrap;gap:.4rem;padding:.5rem .9rem .9rem}

/* ---------- 5. EDITOR ---------- */
.ed-title{flex:1;min-width:10em;width:auto;font-weight:800;font-size:max(16px,1.15rem)}
.ed-row{display:flex;align-items:center;gap:.6rem;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:.5rem .6rem;margin-bottom:.6rem}
.ed-row.drop,#ed-scroll.drop{outline:4px dashed var(--primary);outline-offset:-4px}
.ed-n{width:1.6em;text-align:center;font-weight:800;color:var(--muted);flex:none}
.ed-pic{width:5.4rem;height:5.4rem;flex:none;border:2px dashed #b9bfd0;border-radius:12px;background:#fff;padding:0;overflow:hidden;color:#56628a;font-size:.8rem;font-weight:700;line-height:1.25}
.ed-pic .pic{width:100%;height:100%}
.ed-fields{flex:1;min-width:9em;display:flex;flex-direction:column;gap:.35rem}
.ed-word{font-family:var(--font-word);font-weight:700;font-size:max(16px,1.15rem)}
.ed-side{display:flex;flex-direction:column;gap:.35rem;width:6.6rem;flex:none}
.ed-emoji{text-align:center}
.ed-move{display:flex;gap:.3rem;flex:none}
.ed-move .btn{min-width:44px;padding:.4em}
@media (max-width:700px){.ed-row{flex-wrap:wrap}}

/* ---------- 6. HUB AND OPTIONS ---------- */
.hub-games{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:1rem;margin-bottom:1rem}
.gcard{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:.8rem;display:flex;flex-direction:column;gap:.5rem}
.gcard-play{border:0;border-radius:16px;background:var(--primary);color:var(--on-primary);padding:1rem .8rem;display:flex;flex-direction:column;align-items:center;gap:.2rem;box-shadow:0 5px 0 rgba(0,0,0,.28)}
.gcard-play:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.28)}
.gcard-play[disabled]{opacity:.5;pointer-events:none}
.gcard-i{font-size:3rem;line-height:1.1}
.gcard-n{font-size:1.5rem;font-weight:800}
.gcard-b{font-size:.92rem;opacity:.95;text-align:center;line-height:1.3}
.gcard .opt-l{min-width:6.5em;font-size:.92rem}
.opt{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.4rem 0}
.opt-l{font-weight:700;min-width:9.5em}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--panel2);padding:4px;border-radius:14px}
.seg-b{border:0;background:transparent;padding:.4em .8em;border-radius:10px;font-weight:700;min-height:40px}
.seg-b.on{background:var(--primary);color:var(--on-primary)}
.panel h2{margin:.1rem 0 .5rem;font-size:1.2rem}

/* ---------- 7. GAME SHELL ---------- */
#scr-game{touch-action:none}
.gbar{display:flex;align-items:center;gap:.5em;padding:.3em .6em;background:var(--panel);border-bottom:3px solid var(--line);flex:none;font-size:clamp(15px,2.7vh,30px)}
.gbtn{width:2.3em;height:2.3em;border-radius:.55em;border:0;background:var(--panel2);font-size:1em;flex:none;padding:0;line-height:1}
.gbtn.on{background:var(--primary);color:var(--on-primary)}
.gtitle{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.gtitle b{font-size:1.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gtitle small{font-size:.65em;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gstat{font-size:1.1em;font-weight:800;background:var(--panel2);border-radius:.55em;padding:.3em .6em;white-space:nowrap;font-variant-numeric:tabular-nums}
.gstat.low{background:var(--bad);color:var(--on-bad)}
.gstat.bump{animation:pulse .35s}
.gswitch{display:flex;gap:.25em}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;--su:40px}
.next-btn{position:absolute;right:calc(var(--su)*.3);bottom:calc(var(--su)*.3);z-index:30;border:0;border-radius:calc(var(--su)*.3);
  background:var(--accent);color:#1b1300;font-weight:900;font-size:calc(var(--su)*.6);padding:.3em .8em;box-shadow:0 calc(var(--su)*.1) 0 rgba(0,0,0,.3);animation:popin .3s}
@media (max-width:820px){.gtitle{visibility:hidden}.gtitle b,.gtitle small{display:none}}
@media (max-width:560px){.gswitch{display:none}}

/* ---------- 8. IMAGE QUIZ ---------- */
.iq-wrap{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:calc(var(--su)*.55);padding:calc(var(--su)*.35)}
.iq-wrap.port{flex-direction:column}
.iq-frame{position:relative;flex:none;background:#fff;border-radius:calc(var(--su)*.3);overflow:hidden;box-shadow:0 0 0 calc(var(--su)*.09) var(--ink)}
.iq-pic,.iq-clue,.iq-cover{position:absolute;top:0;left:0;width:100%;height:100%}
.iq-clue{display:flex;align-items:center;justify-content:center;padding:7%;font:700 calc(var(--su)*.6)/1.25 var(--font-word);color:#1b2a4e;text-align:center}
.iq-cover{display:grid}
.iq-tile{background:var(--cover);box-shadow:inset 0 0 0 1px var(--cover-edge);transition:transform .35s,opacity .35s}
.iq-tile.gone{transform:scale(.2) rotate(25deg);opacity:0}
.iq-cap{position:absolute;left:0;right:0;bottom:0;padding:.12em .3em;text-align:center;font:700 calc(var(--su)*.75)/1.2 var(--font-word);background:var(--good);color:var(--on-good);transform:translateY(101%);transition:transform .25s}
.iq-frame.right .iq-cap,.iq-frame.wrong .iq-cap{transform:none}
.iq-frame.wrong .iq-cap{background:#1b2a4e;color:#fff}
.iq-frame.right{animation:pulse .45s}
.iq-side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--su)*.3);align-self:stretch}
.iq-wrap.port .iq-side{align-self:auto;width:100%}
.iq-q{font-size:calc(var(--su)*.62);font-weight:800;text-align:center}
.iq-worth{font-size:calc(var(--su)*.4);font-weight:700;color:var(--muted)}
.iq-buzz{width:calc(var(--su)*3.3);height:calc(var(--su)*3.3);border-radius:50%;border:calc(var(--su)*.1) solid rgba(255,255,255,.55);background:var(--bad);color:var(--on-bad);
  font-size:calc(var(--su)*.85);font-weight:900;box-shadow:0 calc(var(--su)*.2) 0 rgba(0,0,0,.38);touch-action:none;animation:pulse 1.4s infinite}
.iq-buzz:active{transform:translateY(calc(var(--su)*.12));box-shadow:0 calc(var(--su)*.07) 0 rgba(0,0,0,.38);animation:none}
.iq-opts{display:flex;flex-direction:column;gap:calc(var(--su)*.24);width:100%;animation:popin .25s}
.iq-wrap.port .iq-opts{display:grid;grid-template-columns:1fr 1fr}
.iq-opt{border:0;border-radius:calc(var(--su)*.25);padding:.32em .5em;background:var(--tile);color:var(--tile-ink);font:700 calc(var(--su)*.66)/1.2 var(--font-word);
  box-shadow:0 calc(var(--su)*.1) 0 var(--tile-edge);overflow-wrap:anywhere;min-height:calc(var(--su)*1.15)}
.iq-opts.long .iq-opt{font-size:calc(var(--su)*.44)}
.iq-opt.good{background:var(--good);color:var(--on-good);box-shadow:none}
.iq-opt.bad{background:var(--bad);color:var(--on-bad);box-shadow:none;animation:shake .4s}
.iq-opt.dim{opacity:.4;box-shadow:none}

/* ---------- 9. ANAGRAM ---------- */
.an-wrap{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:calc(var(--su)*.2);padding:calc(var(--su)*.25)}
.an-top{flex:1 1 0;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.an-pic{flex:none;max-width:100%;max-height:100%;background:#fff;border-radius:calc(var(--su)*.3);box-shadow:0 0 0 calc(var(--su)*.07) var(--ink)}
.an-top.nopic .an-pic,.an-top.nopic .an-clue{visibility:hidden}
.an-clue{font:700 calc(var(--su)*.55)/1.25 var(--font-word);text-align:center;padding:0 5%}
.an-slots,.an-pool{display:flex;flex-wrap:wrap;justify-content:center;flex:none;max-width:100%}
.an-word{display:flex;margin:0 calc(var(--an)*.3)}
.an-slot,.an-tile,.an-fixed{width:var(--an);height:calc(var(--an)*1.12);margin:calc(var(--an)*.05);padding:0;font:700 calc(var(--an)*.72)/1 var(--font-word);
  display:flex;align-items:center;justify-content:center;border-radius:calc(var(--an)*.17);flex:none;touch-action:none}
.an-slot{background:var(--panel);border:calc(var(--an)*.05) dashed var(--muted);color:var(--ink)}
.an-slot.full{border-style:solid;border-color:var(--tile-edge);background:var(--tile);color:var(--tile-ink);animation:popin .16s}
.an-slot.locked{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}
.an-slot.ok{background:var(--good);border-color:var(--good);color:var(--on-good)}
.an-slot.bad{background:var(--bad);border-color:var(--bad);color:var(--on-bad);animation:shake .4s}
.an-slot.win{animation:pulse .5s}
.an-fixed{width:calc(var(--an)*.5);border:0;background:transparent}
.an-tile{border:0;background:var(--tile);color:var(--tile-ink);box-shadow:0 calc(var(--an)*.09) 0 var(--tile-edge)}
.an-tile.used{visibility:hidden}
.an-tile.gapl{margin-left:calc(var(--an)*.5)}
.an-pool{padding-top:calc(var(--su)*.1)}
.an-pool.off{visibility:hidden}
.an-ctrl{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(var(--su)*.2);flex:none}
.an-btn{border:0;border-radius:calc(var(--su)*.2);background:var(--panel);color:var(--ink);font-weight:800;font-size:calc(var(--su)*.36);padding:.4em .8em;box-shadow:0 3px 0 var(--line);min-height:44px}
.an-btn:active{transform:translateY(2px)}
.an-peek{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;background:var(--ink);color:var(--bg);font:700 calc(var(--su)*1.2)/1.2 var(--font-word);
  padding:.3em .7em;border-radius:calc(var(--su)*.3);white-space:nowrap;max-width:96%;overflow:hidden;animation:popin .2s}

/* ---------- 10. BALLOON POP ---------- */
.stage.g-balloon{background:var(--sky)}
.bp-ground{position:absolute;left:0;right:0;bottom:0;height:var(--gh);background:var(--ground-c)}
.bp-rail{position:absolute;left:0;right:0;bottom:calc(var(--gh)*.52);height:calc(var(--gh)*.14);background:var(--rail)}
.bp-layer{position:absolute;top:0;left:0;right:0;bottom:0}
.bp-cart{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);will-change:transform}
.bp-load{position:absolute;left:0;right:0;top:0;bottom:15%;background:#fff;border:calc(var(--ch)*.04) solid var(--cart);border-radius:calc(var(--ch)*.1);
  display:flex;align-items:center;justify-content:center;overflow:hidden;padding:2%}
.bp-load .pic{width:100%;height:100%}
.bp-cart::before,.bp-cart::after{content:"";position:absolute;bottom:0;width:calc(var(--ch)*.2);height:calc(var(--ch)*.2);border-radius:50%;background:#2b2b33;border:calc(var(--ch)*.045) solid #c9ccd6;box-sizing:border-box}
.bp-cart::before{left:14%}.bp-cart::after{right:14%}
.bp-clue{font:700 calc(var(--ch)*.115)/1.2 var(--font-word);color:#1b2a4e;text-align:center;padding:4%}
.bp-tag{position:absolute;left:5%;right:5%;bottom:19%;display:none;background:var(--good);color:var(--on-good);text-align:center;border-radius:calc(var(--ch)*.06);
  font:700 calc(var(--ch)*.17)/1.3 var(--font-word);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 .2em}
.bp-cart.done .bp-tag{display:block;animation:popin .3s}
.bp-cart.done .bp-load{border-color:var(--good)}
.bp-cart.no .bp-load{animation:shake .4s}
.bp-b{position:absolute;left:0;top:0;will-change:transform}
.bp-balloon{position:relative;display:block;height:var(--bh);min-width:calc(var(--bh)*.92);padding:0 .5em;border:0;border-radius:50%;
  background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.8) 0,rgba(255,255,255,.8) 7%,transparent 8%),var(--c);color:#1b2a4e;
  font-family:var(--font-word);font-weight:700;white-space:nowrap;box-shadow:inset -.22em -.3em 0 rgba(0,0,0,.13);touch-action:none}
.bp-balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;margin-left:-1px;height:calc(var(--bh)*.3);background:rgba(0,0,0,.4)}
.bp-balloon::before{content:"";position:absolute;top:-12%;left:-9%;right:-9%;bottom:-32%}
.bp-b.out{visibility:hidden;pointer-events:none}
.bp-b.in .bp-balloon{animation:popin .35s}
.bp-drop{position:absolute;left:0;top:0;z-index:5;pointer-events:none;padding:.1em .55em;background:#fff;color:#1b2a4e;border:calc(var(--bh)*.03) solid var(--accent);
  border-radius:999px;font:700 calc(var(--bh)*.28)/1.3 var(--font-word);white-space:nowrap;will-change:transform}
.bp-burst{position:absolute;left:0;top:0;z-index:6;pointer-events:none;font-size:calc(var(--bh)*.7);line-height:1;animation:fadeout .4s forwards}
.bp-hint{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);z-index:8;background:var(--panel);color:var(--ink);border-radius:calc(var(--su)*.3);
  padding:.4em .9em;font-weight:800;font-size:calc(var(--su)*.42);text-align:center;pointer-events:none;animation:fadeout 3.5s forwards;max-width:90%}

/* ---------- 11. END SCREEN ---------- */
.end-box{max-width:60rem;margin:0 auto;text-align:center}
.end-box .end-h{font-size:2.6rem;margin:.2rem 0}
.end-stars{font-size:3.6rem;line-height:1;color:var(--line)}

<script>
'use strict';
/* =====================================================================
   WORD GAMES — JavaScript
   Sections:
     1  Utilities            7  Editor
     2  Options (settings)   8  Hub (choose game + options)
     3  Sound and speech     9  Game registry + Runner (shared shell)
     4  Storage (IndexedDB) 10  End screen
     5  Modal, toast, files 11  Print
     6  Library             12  GAMES: image quiz, anagram, balloon pop
                            13  Boot

   HOW TO ADD A NEW GAME (for future sessions)
   -------------------------------------------

     id, name, icon, blurb      text shown on the hub
     minItems                   smallest set size the game needs
     usable(item)               optional filter: can this item be used?
     options:[{key,label,choices:[[value,label],...],def}]   per-game settings

     destroy()                  drop references (timers/loops made with

     print(p)                   return {sheet:Node, key:Node, instruction:String}

     ctx.set, ctx.items (prepared: filtered, shuffled, limited), ctx.pool (all
     valid items, for distractors), ctx.g (this game's options), ctx.stage,
     ctx.word(item) (text with the letter-case option applied),
     ctx.size() -> {W,H,su}, ctx.onResize(fn), ctx.later(fn,ms), ctx.loop(fn(dt)),
     ctx.addScore(n), ctx.progress(i,n), ctx.record(item,correct,note),
     ctx.sfx(name), ctx.say(item), ctx.canSpeak, ctx.advance(fn), ctx.finish()

/* ===================== 1. UTILITIES ===================== */

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mod = (a, n) => ((a % n) + n) % n;

const norm = w => String(w || '').trim().replace(/\s+/g, ' ');
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } }
};

/* ----- item helpers ----- */
const hasPic = it => !!(it.image || it.emoji);
/** Picture element for an item: uploaded image, or an emoji drawn as scalable SVG. */

    s.setAttribute('viewBox', '0 0 100 100');

    t.setAttribute('x', '50'); t.setAttribute('y', '76'); t.setAttribute('font-size', '72'); t.setAttribute('text-anchor', 'middle');
    t.textContent = it.emoji; s.append(t); d.append(s);

}
const hasVisual = it => hasPic(it) || !!clueText(it);

/* ===================== 2. OPTIONS ===================== */
const O = Object.assign({
  theme: 'classroom', timer: 'none', seconds: 60, shuffle: true, count: 'all',
  letterCase: 'typed', sound: true, speak: 'en-GB', advance: 'auto', game: {}
}, LS.get('wg.opts', {}));
const saveOpts = () => LS.set('wg.opts', O);
const caseWord = w => O.letterCase === 'lower' ? w.toLowerCase() : O.letterCase === 'upper' ? w.toUpperCase() : w;
/** Resolve one game's own options (saved value or its default). */
function gopt(game) {
  const o = {}, saved = O.game[game.id] || {};
  (game.options || []).forEach(d => { o[d.key] = saved[d.key] === undefined ? d.def : saved[d.key]; });
  return o;
}
function applyTheme() { document.body.setAttribute('data-theme', O.theme); $('#theme-sel').value = O.theme; }

/* ===================== 3. SOUND AND SPEECH ===================== */
/* All sounds are generated with the Web Audio API. iOS only allows audio after

const Sfx = {

    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);

      switch (name) {
        case 'place': T(520, 0, .07, 'sine', .16); break;
        case 'back': T(330, 0, .07, 'sine', .13); break;
        case 'tile': T(900, 0, .03, 'square', .025); break;
        case 'tick': T(1000, 0, .05, 'square', .05); break;
        case 'buzz': T(170, 0, .28, 'sawtooth', .16); T(176, 0, .28, 'square', .07); break;
        case 'correct': T(660, 0, .13, 'triangle', .22); T(880, .1, .13, 'triangle', .22); T(1320, .2, .28, 'triangle', .22); break;
        case 'wrong': T(300, 0, .2, 'sine', .2, 230); T(230, .17, .3, 'sine', .2, 170); break;
        case 'pop': this.noise(.09, .35); T(520, 0, .1, 'triangle', .2, 130); break;
        case 'bounce': T(230, 0, .18, 'sine', .2, 360); break;
        case 'win': [523, 659, 784, 1047].forEach((f, i) => T(f, i * .13, .22, 'triangle', .22)); T(1047, .55, .5, 'triangle', .2); break;
        case 'done': T(523, 0, .15, 'triangle', .2); T(659, .14, .3, 'triangle', .2); break;
      }
    } catch (e) { /* ignore audio errors */ }
  }
};
const Speech = {
  ok: ('speechSynthesis' in window) && ('SpeechSynthesisUtterance' in window),
  voice(lang) {
    const vs = speechSynthesis.getVoices() || [];
    return vs.find(v => (v.lang || '').replace('_', '-') === lang) || vs.find(v => (v.lang || '').slice(0, 2) === 'en') || null;
  },
  say(text) {
    if (!this.ok || O.speak === 'off' || !text) return;
    try {
      if (text === text.toUpperCase()) text = text.toLowerCase();   // stop "CAT" being spelt out
      speechSynthesis.cancel();

      const v = this.voice(O.speak); if (v) u.voice = v;

  },
  stop() { try { if (this.ok) speechSynthesis.cancel(); } catch (e) { /* ignore */ } }

/* ===================== 4. STORAGE (IndexedDB) ===================== */
/* One object store "sets", keyed by id. Images are stored inside each item as
   compressed JPEG data URLs, so a set is one self-contained record.
   If IndexedDB is unavailable the app still runs from memory (with a warning). */
const DB = {
  db: null, mem: null,
  open() {
    return new Promise(res => {
      let done = false;
      const fail = () => { if (done) return; done = true; this.mem = new Map(); res(false); };
      try {
        const rq = indexedDB.open('word-games', 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore('sets', { keyPath: 'id' });
        rq.onsuccess = () => { if (done) { return; } done = true; this.db = rq.result; res(true); };
        rq.onerror = fail; rq.onblocked = fail;
      } catch (e) { fail(); }
      setTimeout(fail, 5000);
    });
  },
  tx(mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction('sets', mode), rq = fn(t.objectStore('sets'));
      t.oncomplete = () => res(rq && rq.result);
      t.onerror = t.onabort = () => rej(t.error || new Error('Storage error'));
    });
  },
  all() { return this.mem ? Promise.resolve([...this.mem.values()]) : this.tx('readonly', s => s.getAll()); },
  put(set) { if (this.mem) { this.mem.set(set.id, set); return Promise.resolve(); } return this.tx('readwrite', s => s.put(set)); },
  del(id) { if (this.mem) { this.mem.delete(id); return Promise.resolve(); } return this.tx('readwrite', s => s.delete(id)); }
};
const APP = { sets: [] };
const newSet = title => ({ id: uid(), title: title || 'New set', created: Date.now(), updated: Date.now(), items: [] });
const newItem = (word, extra) => Object.assign({ id: uid(), word: word || '', clue: '', emoji: '', image: '' }, extra || {});
const validItems = set => set.items.filter(i => norm(i.word));
async function storeSet(s) {
  if (!APP.sets.includes(s)) APP.sets.push(s);
  try { await DB.put(s); } catch (e) { toast('Could not save. The storage on this device may be full.'); }
}
async function saveSet(s) { s.updated = Date.now(); await storeSet(s); }
async function deleteSet(s) {
  APP.sets = APP.sets.filter(x => x !== s);
  try { await DB.del(s.id); } catch (e) { /* ignore */ }
}
function uniqueTitle(t) {
  const has = x => APP.sets.some(s => s.title.trim().toLowerCase() === x.toLowerCase());
  if (!has(t)) return t;
  let n = 2; while (has(t + ' (' + n + ')')) n++;
  return t + ' (' + n + ')';
}
/** Validate anything that comes from an imported file. */
function cleanSet(r) {
  if (!r || typeof r !== 'object' || !Array.isArray(r.items)) return null;
  const str = (v, n) => String(v == null ? '' : v).slice(0, n);
  return {
    id: typeof r.id === 'string' && r.id ? r.id.slice(0, 40) : uid(),
    title: norm(str(r.title, 120)) || 'Untitled set',
    created: +r.created || Date.now(), updated: +r.updated || Date.now(),
    items: r.items.filter(i => i && typeof i === 'object').slice(0, 500).map(i => ({
      id: typeof i.id === 'string' && i.id ? i.id.slice(0, 40) : uid(),
      word: str(i.word, 200), clue: str(i.clue, 400), emoji: str(i.emoji, 16),
      image: typeof i.image === 'string' && /^data:image\/(jpeg|png|gif|webp);base64,/.test(i.image) ? i.image : ''
    }))
  };
}
const SAMPLE = [['dog', '🐶', 'It says woof.'], ['cat', '🐱', 'It says meow.'], ['pig', '🐷', 'It is pink and says oink.'], ['cow', '🐮', 'It gives us milk.'],
  ['lion', '🦁', 'It is the king of the jungle.'], ['monkey', '🐵', 'It loves bananas.'], ['rabbit', '🐰', 'It has long ears.'], ['elephant', '🐘', 'It is very big and grey.']];

/* ===================== 5. MODAL, TOAST, FILES ===================== */
function show(name) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === 'scr-' + name)); }
/** Promise-based dialog. Resolves with the tapped button's value (null if dismissed). */
function modal({ title, body, buttons, wide }) {
  return new Promise(res => {
    const close = v => { back.remove(); res(v); };
    const back = h('div', { class: 'modal-back', onpointerdown: e => { if (e.target === back) close(null); } },
      h('div', { class: 'modal' + (wide ? ' wide' : '') },
        title && h('h2', null, title),
        h('div', null, typeof body === 'string' ? h('p', null, body) : body),
        h('div', { class: 'modal-btns' }, (buttons || [{ label: 'OK', value: true, kind: 'primary' }]).map(b =>
          h('button', { class: 'btn ' + (b.kind || ''), onclick: () => close(b.value) }, b.label)))));

/* ===================== 9. GAME REGISTRY + RUNNER ===================== */
const Games = { list: [], register(g) { this.list.push(g); }, get(id) { return this.list.find(g => g.id === id); } };

/** Runner owns the shared shell: top bar, timer, score, results and clean-up.
    Game modules only draw inside ctx.stage. */
const Runner = (() => {
  let cur = null;
  const stage = $('#stage');
  function measure() {
    const r = stage.getBoundingClientRect(), su = Math.max(8, Math.min(r.width / 16, r.height / 9));
    stage.style.setProperty('--su', su + 'px');
    return { W: r.width, H: r.height, su };
  }
  function start(gameId, set) {
    const game = Games.get(gameId), valid = validItems(set), usable = valid.filter(i => !game.usable || game.usable(i));
    if (valid.length < (game.minItems || 1)) { modal({ title: game.name, body: 'This game needs at least ' + plural(game.minItems, 'word') + '. Add a few more words to “' + set.title + '” and try again.' }); return false; }
    if (!usable.length) { modal({ title: game.name, body: 'This game needs words that have a picture or a clue. Add some in the editor and try again.' }); return false; }
    stop();
    let items = usable.slice();
    if (O.shuffle) shuffle(items);
    if (O.count !== 'all') items = items.slice(0, +O.count);
    show('game');
    const run = { game, set, items, results: new Map(), score: 0, alive: true, timeouts: new Set(), raf: 0, resize: [], dim: null, t0: performance.now(), lastTick: null };
    cur = run;
    stage.className = 'stage g-' + game.id; stage.innerHTML = ''; stage.removeAttribute('style');
    run.dim = measure();
    const ctx = run.ctx = {
      set, items, pool: valid, g: gopt(game), stage, canSpeak: Speech.ok && O.speak !== 'off',
      word: it => caseWord(norm(it.word)),
      size: () => run.dim,
      onResize: fn => run.resize.push(fn),
      later(fn, ms) { const id = setTimeout(() => { run.timeouts.delete(id); if (run.alive) fn(); }, ms); run.timeouts.add(id); return id; },
      loop(fn) {
        let last = performance.now();
        const step = now => { if (!run.alive) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; fn(dt); run.raf = requestAnimationFrame(step); };
        run.raf = requestAnimationFrame(step);
      },
      addScore(n) { run.score += n; const el = $('#g-score'); el.textContent = '★ ' + run.score; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); },
      progress(i, n) { $('#g-progress').textContent = i + ' / ' + n; },
      record(item, correct, note) { run.results.set(item.id, { correct, note }); },
      sfx: name => Sfx.play(name),
      say: it => Speech.say(norm(it.word)),
      /** Move on after feedback: automatically, or with a big Next button (teacher-paced). */
      advance(fn, ms) {
        if (O.advance === 'auto') return ctx.later(fn, ms || 1900);
        const b = h('button', { class: 'next-btn', onclick: () => { b.remove(); if (run.alive) fn(); } }, 'Next ▶'); stage.append(b);
      },
      finish: () => finish('done')
    };
    // top bar
    $('#g-name').textContent = game.icon + ' ' + game.name; $('#g-set').textContent = set.title;
    $('#g-score').textContent = '★ 0'; $('#g-progress').textContent = '';
    const tm = $('#g-timer'); tm.hidden = O.timer === 'none'; tm.classList.remove('low'); tm.textContent = '⏱ ' + fmtTime(O.timer === 'down' ? O.seconds : 0);
    $('#g-sound').textContent = O.sound ? '🔊' : '🔇';
    const sw = $('#g-switch'); sw.innerHTML = '';
    Games.list.forEach(g => sw.append(h('button', { class: 'gbtn' + (g === game ? ' on' : ''), title: g.name, 'aria-label': g.name, onclick: () => { if (g !== game) start(g.id, set); } }, g.icon)));
    game.init(ctx); game.start();
    run.iv = setInterval(() => {
      if (O.timer === 'none') return;
      const el = (performance.now() - run.t0) / 1000;
      if (O.timer === 'up') { tm.textContent = '⏱ ' + fmtTime(Math.floor(el)); return; }
      const rem = O.seconds - el, s = Math.ceil(rem);
      tm.textContent = '⏱ ' + fmtTime(s); tm.classList.toggle('low', rem <= 10);
      if (rem <= 5 && rem > 0 && s !== run.lastTick) { run.lastTick = s; Sfx.play('tick'); }
      if (rem <= 0) finish('time');
    }, 200);
    return true;
  }
  function stop() {
    const run = cur; if (!run) return;
    cur = null; run.alive = false;
    clearInterval(run.iv); run.timeouts.forEach(clearTimeout); cancelAnimationFrame(run.raf);
    try { run.game.destroy(); } catch (e) { /* ignore */ }
    stage.innerHTML = ''; Speech.stop();
  }
  function finish(reason) {
    const run = cur; if (!run) return;
    const elapsed = (performance.now() - run.t0) / 1000;
    stop(); End.show(run, reason, O.timer === 'down' && reason === 'time' ? O.seconds : elapsed);
  }
  window.addEventListener('resize', () => { if (!cur) return; cur.dim = measure(); cur.resize.forEach(fn => { try { fn(); } catch (e) { /* ignore */ } }); });
  return { start, stop, get set() { return cur && cur.set; } };
})();

/** Correct word + distractors taken from other words in the set (no duplicates). */
function pickOptions(item, pool, n, word) {
  const right = word(item), seen = new Set([right.toLowerCase()]), ds = [];
  for (const p of shuffle(pool.slice())) {
    if (ds.length >= n - 1) break;
    const w = word(p), k = w.toLowerCase();
    if (!seen.has(k)) { seen.add(k); ds.push(w); }
  }
  return shuffle([right, ...ds]);
}

      if (p.state === 'fall' && p.y + p.h >= cartTop + d.ch * 0.14) land(p);
      if (p.state === 'stuck') { p.el.remove(); return false; }
      if (p.state === 'bounce') {
        p.life -= dt; p.el.style.opacity = Math.max(0, p.life / 0.7);
        if (p.life <= 0) { p.el.remove(); p.b.out = false; p.b.el.classList.remove('out'); p.b.el.classList.add('in'); return false; }
      }
      p.el.style.transform = 'translate3d(' + p.x + 'px,' + p.y + 'px,0)';
      return true;
    });
  }
  return {
    id: 'balloon', name: 'Balloon pop', icon: '🎈', minItems: 2,
    blurb: 'Pop a balloon at the right moment to drop its word onto the matching picture on the train.',
    usable: hasVisual,
    options: [
      { key: 'carts', label: 'Pictures at once', choices: [[3, '3'], [4, '4'], [5, '5']], def: 4 },
      { key: 'speed', label: 'Speed', choices: [['slow', 'Slow'], ['normal', 'Normal'], ['fast', 'Fast']], def: 'normal' }
    ],
    init(ctx) {
      c = ctx; st = { done: 0, round: 0, carts: [], balloons: [], drops: [], miss: new Map(), d: null, sw: 0, tT: 0, tB: 0, left: 0 };
      st.layer = h('div', { class: 'bp-layer' });
      c.stage.append(h('div', { class: 'bp-ground' }), h('div', { class: 'bp-rail' }), st.layer, h('div', { class: 'bp-hint' }, 'Pop a balloon to drop its word onto the matching picture!'));
      c.onResize(resize); c.progress(0, c.items.length);
    },
    start() { round(); c.loop(frame); },
    destroy() { c = null; st = null; },
    print(p) {
      const sheet = h('div'), key = h('ol', { class: 'pr-key' }), L = 'abcdefghijklmnopqrstuvwxyz';
      for (let s = 0; s < p.items.length; s += 6) {
        const grp = p.items.slice(s, s + 6); let words = shuffle(grp.slice());
        if (grp.length > 1 && words.every((w, i) => w === grp[i])) words = words.slice(1).concat(words[0]);
        const block = h('div', { class: 'pr-match' + (s ? ' pr-break' : '') });
        grp.forEach((it, i) => block.append(h('div', { class: 'pr-mrow' },
          h('span', { class: 'pr-mw' }, (s + i + 1) + '. ' + p.word(words[i])), h('span', { class: 'pr-dot' }), h('span', { class: 'pr-gap' }), h('span', { class: 'pr-dot' }),
          h('span', { class: 'pr-ml' }, L[i]), hasPic(it) ? pic(it) : h('div', { class: 'pr-clue' }, clueText(it)))));
        words.forEach(w => key.append(h('li', null, p.word(w) + '  →  ' + L[grp.indexOf(w)])));
        sheet.append(block);
      }
      return { sheet, key, instruction: 'Draw a line from each word to its picture.' };
    }
  };
})());

(function wire() {
  // library
  $('#btn-new').onclick = async () => { const s = newSet(); await saveSet(s); Editor.open(s, 'library'); const t = $('#ed-title'); t.focus(); t.select(); };
  $('#btn-import').onclick = async () => { const [f] = await pickFiles($('#file-import'), false); if (f) importFile(f); };
  $('#btn-export-all').onclick = () => exportSets(APP.sets, 'all-word-sets');
  $('#lib-search').oninput = () => Library.render();
  $('#theme-sel').onchange = e => { O.theme = e.target.value; saveOpts(); applyTheme(); };
  // editor
  $('#ed-back').onclick = () => Editor.leave();
  $('#ed-play').onclick = () => Editor.leave('hub');
  $('#ed-title').oninput = e => { Editor.set.title = e.target.value; Editor.touch(); };
  $('#ed-add').onclick = () => { Editor.set.items.push(newItem()); Editor.touch(); Editor.render(); const w = document.querySelectorAll('.ed-word'); const last = w[w.length - 1]; if (last) { last.focus(); last.scrollIntoView({ block: 'center' }); } };
  $('#ed-paste').onclick = () => Editor.pasteList();
  $('#ed-pics').onclick = async () => { const fs = await pickFiles($('#file-image'), true); if (fs.length) Editor.addPictures(fs); };
  const sc = $('#ed-scroll');
  sc.addEventListener('dragover', e => { e.preventDefault(); sc.classList.add('drop'); });
  sc.addEventListener('dragleave', e => { if (e.target === sc) sc.classList.remove('drop'); });
  sc.addEventListener('drop', e => { e.preventDefault(); sc.classList.remove('drop'); Editor.addPictures([...(e.dataTransfer ? e.dataTransfer.files : [])]); });
  // stop the browser opening a file that is dropped outside a drop zone
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());
  // hub
  $('#hub-back').onclick = () => Library.show();
  $('#hub-edit').onclick = () => Editor.open(Hub.set, 'hub');
  // game bar
  $('#g-exit').onclick = () => { const s = Runner.set || Hub.set; Runner.stop(); if (s) Hub.show(s); else Library.show(); };
  $('#g-sound').onclick = e => { O.sound = !O.sound; saveOpts(); e.currentTarget.textContent = O.sound ? '🔊' : '🔇'; };
  const de = document.documentElement, fsOn = () => document.fullscreenElement || document.webkitFullscreenElement;
  if ((de.requestFullscreen || de.webkitRequestFullscreen) && !navigator.standalone) {
    $('#g-full').onclick = () => {
      try { if (fsOn()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); else (de.requestFullscreen || de.webkitRequestFullscreen).call(de); } catch (e) { /* ignore */ }
    };
  } else $('#g-full').hidden = true;
  // iPad: unlock audio on first touch; no pinch-zoom, double-tap zoom or page bounce during games
  window.addEventListener('pointerdown', () => Sfx.unlock(), { passive: true });
  document.addEventListener('gesturestart', e => e.preventDefault());
  document.addEventListener('dblclick', e => e.preventDefault());
  document.addEventListener('touchmove', e => { if ($('#scr-game').classList.contains('active')) e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', e => { if (!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) e.preventDefault(); });
  if (Speech.ok) { try { speechSynthesis.getVoices(); } catch (e) { /* ignore */ } }
  // Home Screen icon, drawn at run time so the file stays self-contained
  try {
    const cv = document.createElement('canvas'); cv.width = cv.height = 180; const x = cv.getContext('2d');
    x.fillStyle = '#2563eb'; x.fillRect(0, 0, 180, 180); x.fillStyle = '#ffd23f'; x.beginPath(); x.arc(90, 82, 58, 0, 7); x.fill();
    x.fillStyle = '#1b2a4e'; x.font = 'bold 60px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('Aa', 90, 86);
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = cv.toDataURL('image/png'); document.head.append(l);
  } catch (e) { /* ignore */ }
})();

(async function boot() {
  applyTheme();
  await DB.open();
  try { APP.sets = (await DB.all()).map(cleanSet).filter(Boolean); } catch (e) { APP.sets = []; }
  if (!APP.sets.length && !LS.get('wg.seeded', false)) {
    const s = newSet('Animals (sample)');
    s.items = SAMPLE.map(([word, emoji, clue]) => newItem(word, { emoji, clue }));
    await saveSet(s); LS.set('wg.seeded', true);
  }
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
  Library.show();
})();
